<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>API Dev Client</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #08080b;
    --surface:    #0f0f14;
    --surface2:   #141419;
    --border:     #2a2530;
    --border2:    #3a2f45;
    --gold:       #c9a55a;
    --gold-dim:   #7a6035;
    --crimson:    #8b2d3a;
    --crimson-hi: #b03a4a;
    --stone:      #a09898;
    --muted:      #524850;
    --text:       #ccc4b8;
    --success:    #5a9468;
    --danger:     #8b2d2d;
    --rare:       #6a48a0;
    --epic:       #9a6820;
    --uncommon:   #3a7850;
    --common:     #4a4850;
    --ff-title:   'Cinzel', serif;
    --ff-body:    'Crimson Text', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 15px;
    min-height: 100vh;
    background-image: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(139,45,58,.07) 0%, transparent 70%);
  }

  /* ── TOPBAR ─────────────────────────────────── */
  #topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 24px; height: 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    position: relative;
  }
  #topbar::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    pointer-events: none;
  }
  .logo {
    font-family: var(--ff-title); font-size: 12px;
    letter-spacing: 4px; color: var(--gold); text-transform: uppercase; white-space: nowrap;
  }
  .logo span { color: var(--muted); font-size: 9px; letter-spacing: 2px; }
  #base-url {
    flex: 1; max-width: 300px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--stone); padding: 5px 10px;
    font-family: 'Courier New', monospace; font-size: 12px;
  }
  #base-url:focus { outline: none; border-color: var(--gold-dim); }
  #player-info {
    margin-left: auto; display: none;
    flex-direction: column; align-items: flex-end; gap: 1px;
  }
  #player-info .p-username { font-family: var(--ff-title); font-size: 11px; color: var(--gold); letter-spacing: 1px; }
  #player-info .p-email { font-family: var(--ff-body); font-size: 11px; color: var(--muted); font-style: italic; }
  #btn-logout {
    background: none; border: 1px solid var(--crimson); color: var(--crimson-hi);
    padding: 5px 14px; cursor: pointer;
    font-family: var(--ff-title); font-size: 9px; letter-spacing: 2px; display: none;
    transition: background .15s;
  }
  #btn-logout:hover { background: rgba(139,45,58,.2); }

  /* ── TOAST ──────────────────────────────────── */
  #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 10px 16px; font-family: var(--ff-body); font-size: 14px;
    border-left: 2px solid; animation: fadeUp .2s ease;
    background: var(--surface2); max-width: 300px;
  }
  .toast.ok   { border-color: var(--success); color: #7ab88a; }
  .toast.err  { border-color: var(--crimson); color: var(--crimson-hi); }
  .toast.info { border-color: var(--gold-dim); color: var(--gold); }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; } }

  /* ── VIEWS ───────────────────────────────────── */
  .view { display: none; }
  .view.active { display: block; }
  #main-view.active { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 46px); }

  /* ── AUTH ────────────────────────────────────── */
  #auth-view.active {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 46px); padding: 30px 20px;
  }
  .auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); max-width: 640px; width: 100%; }
  .card { background: var(--surface); padding: 32px 28px; position: relative; }
  .card::before {
    content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .card h2 {
    font-family: var(--ff-title); font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 24px; font-weight: 400;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; color: var(--muted);
    margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; font-family: var(--ff-title);
  }
  .field input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--border2);
    color: var(--text); padding: 7px 0;
    font-family: var(--ff-body); font-size: 15px; transition: border-color .2s;
  }
  .field input:focus { outline: none; border-color: var(--gold-dim); }

  /* ── BUTTONS ─────────────────────────────────── */
  .btn {
    display: inline-block; padding: 8px 0; width: 100%;
    background: none; border: 1px solid var(--gold-dim);
    color: var(--gold); cursor: pointer;
    font-family: var(--ff-title); font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; transition: background .15s, color .15s; margin-top: 8px;
  }
  .btn:hover { background: rgba(201,165,90,.08); }
  .btn.secondary { border-color: var(--border2); color: var(--muted); }
  .btn.secondary:hover { border-color: var(--gold-dim); color: var(--gold); }
  .btn.danger { border-color: var(--crimson); color: var(--crimson-hi); }
  .btn.danger:hover { background: rgba(139,45,58,.15); }
  .btn.sell { border-color: var(--success); color: var(--success); }
  .btn.sell:hover { background: rgba(90,148,104,.1); }

  /* ── SECTION TITLE ───────────────────────────── */
  .section-title {
    font-family: var(--ff-title); font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--gold); font-weight: 400;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .section-title small { font-family: var(--ff-body); color: var(--muted); font-size: 12px; letter-spacing: 0; font-style: italic; }
  .refresh-controls { display: flex; align-items: center; gap: 10px; }
  .refresh-controls .btn-sm {
    background: none; border: 1px solid var(--border2); color: var(--muted);
    padding: 3px 10px; cursor: pointer; font-family: var(--ff-title);
    font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
    transition: border-color .15s, color .15s;
  }
  .refresh-controls .btn-sm:hover { border-color: var(--gold-dim); color: var(--gold); }
  .auto-refresh-label { display: flex; align-items: center; gap: 5px; font-family: var(--ff-body); font-size: 12px; color: var(--muted); font-style: italic; cursor: pointer; white-space: nowrap; }
  .auto-refresh-label input[type=checkbox] { accent-color: var(--gold-dim); cursor: pointer; }

  /* ── WALLET ──────────────────────────────────── */
  #wallet-block {
    background: var(--surface2); border: 1px solid var(--border);
    border-left: 2px solid var(--gold-dim);
    padding: 12px 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #wallet-block .w-label { font-family: var(--ff-title); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  #wallet-block .w-value { font-family: var(--ff-title); font-size: 20px; color: var(--gold); letter-spacing: 1px; }
  #wallet-block .w-sub { font-family: var(--ff-body); font-size: 11px; color: var(--muted); font-style: italic; margin-top: 1px; }

  /* ── MARKET ──────────────────────────────────── */
  #market-panel { padding: 24px; overflow-y: auto; border-right: 1px solid var(--border); }
  .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1px; background: var(--border); }
  .market-card {
    background: var(--surface); padding: 18px;
    display: flex; flex-direction: column; gap: 8px; transition: background .15s;
  }
  .market-card:hover { background: var(--surface2); }
  .market-card .icon { font-size: 24px; line-height: 1; }
  .market-card .m-title { font-family: var(--ff-title); font-size: 11px; color: var(--text); letter-spacing: .5px; }
  .market-card .m-desc { font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.5; flex: 1; }
  .market-card .m-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .price { font-family: var(--ff-title); font-size: 13px; color: var(--gold); }
  .rarity-badge {
    font-family: var(--ff-title); font-size: 8px; letter-spacing: 2px;
    text-transform: uppercase; padding: 2px 6px;
  }
  .rarity-COMMON   { color: var(--common); border: 1px solid var(--common); }
  .rarity-UNCOMMON { color: var(--uncommon); border: 1px solid var(--uncommon); }
  .rarity-RARE     { color: var(--rare); border: 1px solid var(--rare); }
  .rarity-EPIC     { color: var(--epic); border: 1px solid var(--epic); }
  .card-actions { display: flex; gap: 6px; }
  .card-actions .btn { margin: 0; padding: 6px 0; font-size: 9px; letter-spacing: 2px; }

  /* ── INVENTORY ───────────────────────────────── */
  #inventory-panel { background: var(--surface); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }
  #inv-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
  .inv-item {
    background: var(--surface2); padding: 12px 14px;
    display: flex; gap: 10px; align-items: center; transition: background .15s;
  }
  .inv-item:hover { background: #18181e; }
  .inv-item .icon { font-size: 20px; flex-shrink: 0; }
  .inv-item .info { flex: 1; min-width: 0; }
  .inv-item .i-title {
    font-family: var(--ff-title); font-size: 10px; letter-spacing: .5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
  }
  .inv-item .i-prices { font-size: 12px; color: var(--muted); margin-top: 3px; font-style: italic; }
  .inv-item .i-prices b { color: var(--gold); font-style: normal; }
  .inv-item .actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .inv-item .actions .btn { padding: 4px 10px; font-size: 8px; letter-spacing: 1px; margin: 0; width: auto; }

  .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 20px; font-style: italic; }
  .loading { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; font-style: italic; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">⚔ Arcane Market <span>/ dev client</span></div>
  <input id="base-url" type="text" value="http://localhost:8080" />
  <div id="player-info">
    <div class="p-username" id="player-username">—</div>
    <div class="p-email" id="player-email">—</div>
  </div>
  <button id="btn-logout">⬡ Déconnexion</button>
</div>

<div id="toast-container"></div>

<!-- AUTH -->
<div id="auth-view" class="view active">
  <div class="auth-grid">
    <div class="card">
      <h2>Connexion</h2>
      <div class="field"><label>Email</label><input id="l-email" type="email" /></div>
      <div class="field"><label>Mot de passe</label><input id="l-pwd" type="password" /></div>
      <button class="btn" onclick="doLogin()">Entrer</button>
    </div>
    <div class="card">
      <h2>Inscription</h2>
      <div class="field"><label>Nom</label><input id="r-username" type="text" /></div>
      <div class="field"><label>Email</label><input id="r-email" type="email" /></div>
      <div class="field"><label>Mot de passe</label><input id="r-pwd" type="password" /></div>
      <button class="btn secondary" onclick="doRegister()">Créer un compte</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main-view" class="view">
  <div id="market-panel">
    <div class="section-title">
      Marché <small id="market-count"></small>
      <div class="refresh-controls">
        <label class="auto-refresh-label">
          <input type="checkbox" id="auto-refresh" checked /> auto 45s
        </label>
        <button class="btn-sm" onclick="refreshAll()">↻ Refresh</button>
        <span id="refresh-countdown" style="font-family:var(--ff-body);font-size:11px;color:var(--muted);font-style:italic;min-width:28px;text-align:right"></span>
      </div>
    </div>
    <div id="market-grid" class="market-grid"></div>
  </div>
  <div id="inventory-panel">
    <div id="wallet-block">
      <div>
        <div class="w-label">Bourse</div>
        <div class="w-sub" id="wallet-sub">—</div>
      </div>
      <div class="w-value"><span id="wallet-amount">—</span> ◆</div>
    </div>
    <div class="section-title" style="color:var(--stone)">Inventaire <small id="inv-count"></small></div>
    <div id="inv-list"></div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token') || null;
  const base = () => document.getElementById('base-url').value.replace(/\/$/, '');

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body)  opts.body = JSON.stringify(body);
    const res  = await fetch(base() + path, opts);
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) throw new Error(data?.message || data || res.statusText);
    return data;
  }

  function toast(msg, type = 'info') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  async function doLogin(email, pwd) {
    email = email || document.getElementById('l-email').value;
    pwd  = pwd  || document.getElementById('l-pwd').value;
    try {
      const res = await api('POST', '/api/auth/login', { email, password: pwd });
      setToken(res);
      listenServer();
    } catch(e) { toast(e.message, 'err'); }
  }

  async function doRegister() {
    const userName  = document.getElementById('r-username').value;
    const email = document.getElementById('r-email').value;
    const pwd  = document.getElementById('r-pwd').value;
    try {
      const res = await api('POST', '/api/auth/register', { userName, email, password: pwd });
      const tok = typeof res === 'string' ? res : (res?.token || res?.accessToken || res?.jwt);
      if (tok) { setToken(tok); }
      else { toast('Compte créé', 'ok'); await doLogin(email, pwd); }
    } catch(e) { toast(e.message, 'err'); }
  }

  function setToken(value) {
    token = typeof value === 'string' ? value : (value?.token || value?.accessToken || value?.jwt || null);
    if (!token) { toast('Token introuvable : ' + JSON.stringify(value), 'err'); return; }
    localStorage.setItem('token', token);
    enterApp();
  }

  function doLogout() {
    token = null; localStorage.removeItem('token');
    stopAutoRefresh();
    showView('auth');
    document.getElementById('btn-logout').style.display = 'none';
    document.getElementById('player-info').style.display = 'none';
  }
  document.getElementById('btn-logout').onclick = doLogout;

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id + '-view').classList.add('active');
  }

  function listenServer() {
    const source = new EventSource("/api/events");

    source.addEventListener("end-of-day", (e) => {
      const data = JSON.parse(e.data);
      console.log("End of day :", data);
    });

    source.onerror = () => console.warn("SSE déconnecté, reconnexion auto...");
  }

  async function enterApp() {
    showView('main');
    document.getElementById('btn-logout').style.display = 'block';
    try {
      const player = await api('GET', '/api/account/info');
      document.getElementById('player-username').textContent  = player.userName  || '—';
      document.getElementById('player-email').textContent = player.email || '—';
      document.getElementById('player-info').style.display = 'flex';
    } catch {}
    refreshAll();
    startAutoRefresh();
  }

  function refreshAll() {
    if(token!= null) listenServer();
    loadMarket();
    loadInventory();
    loadWallet();
  }

  let autoRefreshTimer = null;
  let countdownTimer   = null;

  function startAutoRefresh() {
    clearInterval(autoRefreshTimer);
    clearInterval(countdownTimer);
    let remaining = 45;
    const tick = () => {
      document.getElementById('refresh-countdown').textContent =
        document.getElementById('auto-refresh').checked ? remaining + 's' : '';
      remaining--;
      if (remaining < 0) remaining = 45;
    };
    tick();
    countdownTimer   = setInterval(tick, 1000);
    autoRefreshTimer = setInterval(() => {
      if (document.getElementById('auto-refresh').checked) { refreshAll(); remaining = 45; }
    }, 45000);
  }

  function stopAutoRefresh() {
    clearInterval(autoRefreshTimer);
    clearInterval(countdownTimer);
    document.getElementById('refresh-countdown').textContent = '';
  }
  document.getElementById('auto-refresh').addEventListener('change', function() {
    if (this.checked) startAutoRefresh(); else stopAutoRefresh();
  });

  async function loadWallet() {
    try {
      const player = await api('GET', '/api/account/info');
      document.getElementById('wallet-amount').textContent = player.wallet ?? '—';
      document.getElementById('wallet-sub').textContent = player.userName || player.email || '—';
    } catch {}
  }

  async function loadMarket() {
    const grid = document.getElementById('market-grid');
    grid.style.background = 'none';
    grid.innerHTML = '<div class="loading">Consultation du marché…</div>';
    try {
      const items = await api('GET', '/api/market/items');
      document.getElementById('market-count').textContent = items.length + ' reliques';
      grid.innerHTML = '';
      grid.style.background = items.length ? 'var(--border)' : 'none';
      if (!items.length) { grid.innerHTML = '<div class="empty-state">Le marché est vide.</div>'; return; }
      items.forEach(item => grid.appendChild(makeMarketCard(item)));
    } catch(e) { grid.innerHTML = '<div class="empty-state">' + e.message + '</div>'; }
  }

  function makeMarketCard(item) {
    const el = document.createElement('div');
    el.className = 'market-card';
    el.innerHTML = `
      <div class="icon">${item.icon || '🗡️'}</div>
      <div class="rarity-badge rarity-${item.rarity || 'COMMON'}">${item.rarity || 'COMMON'}</div>
      <div class="m-title">${item.title}</div>
      <div class="m-desc">${item.description || ''}</div>
      <div class="m-footer"><div class="price">${item.currentPrice} ◆</div></div>
      <div class="card-actions">
        <button class="btn" onclick="buyItemRequest(${item.marketId})">Acquérir</button>
        <button class="btn secondary" onclick="rerollItem(${item.marketId})">Reroll</button>
      </div>
    `;
    return el;
  }

  async function buyItemRequest(id) {
    try { await api('POST', '/api/trade/buy/' + id); toast('Acquis.', 'ok'); refreshAll(); }
    catch(e) { toast(e.message, 'err'); }
  }

  async function rerollItem(id) {
    try { await api('POST', '/api/market/reroll/' + id); toast('Marché actualisé.', 'info'); loadMarket(); }
    catch(e) { toast(e.message, 'err'); }
  }

  async function loadInventory() {
    const list = document.getElementById('inv-list');
    list.innerHTML = '<div class="loading">Inspection du sac…</div>';
    try {
      const items = await api('GET', '/api/inventory/items');
      document.getElementById('inv-count').textContent = items.length + ' objets';
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<div class="empty-state">Inventaire vide.</div>'; return; }
      items.forEach(item => list.appendChild(makeInvItem(item)));
    } catch(e) { list.innerHTML = '<div class="empty-state">' + e.message + '</div>'; }
  }

  function makeInvItem(item) {
    const el = document.createElement('div');
    el.className = 'inv-item';
    const profit = item.currentPrice - item.boughtPrice;
    const sign   = profit >= 0 ? '+' : '';
    const pColor = profit >= 0 ? 'var(--success)' : 'var(--crimson-hi)';
    el.innerHTML = `
      <div class="icon">${item.icon || '🗡️'}</div>
      <div class="info">
        <div class="i-title">${item.title}</div>
        <div class="i-prices">Achat ${item.boughtPrice}◆ · Val. <b>${item.currentPrice}◆</b></div>
      </div>
      <div style="font-family:var(--ff-title);font-size:10px;color:${pColor};margin-right:8px;white-space:nowrap">${sign}${profit}◆</div>
      <div class="actions">
        <button class="btn sell"   onclick="sellItem(${item.inventoryId})">Vendre</button>
        <button class="btn danger" onclick="discardItem(${item.inventoryId})">Jeter</button>
      </div>
    `;
    return el;
  }

  async function sellItem(id) {
    try { await api('POST', '/api/trade/sell/' + id); toast('Vendu.', 'ok'); refreshAll(); }
    catch(e) { toast(e.message, 'err'); }
  }

  async function discardItem(id) {
    try { await api('POST', '/api/inventory/discard/' + id); toast('Jeté.', 'info'); loadInventory(); }
    catch(e) { toast(e.message, 'err'); }
  }

  if (token) enterApp();
</script>
</body>
</html>
