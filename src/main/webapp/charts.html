<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chart — Price History</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #08080b;
    --surface:    #0f0f14;
    --surface2:   #141419;
    --border:     #2a2530;
    --border2:    #3a2f45;
    --gold:       #c9a55a;
    --gold-dim:   #7a6035;
    --crimson:    #8b2d3a;
    --crimson-hi: #b03a4a;
    --stone:      #a09898;
    --muted:      #524850;
    --text:       #ccc4b8;
    --bull:       #5a9468;
    --bull-dim:   #2a4a34;
    --bear:       #8b2d3a;
    --bear-dim:   #3a1a1e;
    --ff-title:   'Cinzel', serif;
    --ff-body:    'Crimson Text', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--ff-body); font-size: 15px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    background-image: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(139,45,58,.07) 0%, transparent 70%);
  }

  /* ── TOPBAR ── */
  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: 46px; flex-shrink: 0;
    background: var(--surface); position: relative; z-index: 10;
  }
  #topbar::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .logo { font-family: var(--ff-title); font-size: 12px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; white-space: nowrap; }
  .logo span { color: var(--muted); font-size: 9px; letter-spacing: 2px; }
  #base-url-input {
    margin-left: auto; background: var(--bg); border: 1px solid var(--border);
    color: var(--stone); padding: 4px 8px; font-family: monospace; font-size: 11px; width: 200px;
  }
  #base-url-input:focus { outline: none; border-color: var(--gold-dim); }

  /* ── BODY BELOW TOPBAR ── */
  #layout {
    flex: 1; display: flex; overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 200px; flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 12px 14px 10px;
    font-family: var(--ff-title); font-size: 9px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #item-list { flex: 1; overflow-y: auto; }
  #item-list::-webkit-scrollbar { width: 3px; }
  #item-list::-webkit-scrollbar-track { background: transparent; }
  #item-list::-webkit-scrollbar-thumb { background: var(--border2); }
  .item-entry {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border); transition: background .12s;
    user-select: none;
  }
  .item-entry:hover { background: var(--surface2); }
  .item-entry.active {
    background: var(--surface2);
    border-left: 2px solid var(--gold-dim);
    padding-left: 12px;
  }
  .item-entry .ie-icon { font-size: 18px; flex-shrink: 0; line-height: 1; }
  .item-entry .ie-name {
    font-family: var(--ff-title); font-size: 10px; letter-spacing: .5px;
    color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-entry.active .ie-name { color: var(--gold); }
  .item-entry .ie-rarity {
    font-family: var(--ff-title); font-size: 7px; letter-spacing: 1px;
    text-transform: uppercase; margin-top: 2px;
  }
  .r-COMMON   { color: var(--muted); }
  .r-UNCOMMON { color: #3a7850; }
  .r-RARE     { color: #6a48a0; }
  .r-EPIC     { color: #9a6820; }
  #sidebar-empty { padding: 20px 14px; font-size: 12px; color: var(--muted); font-style: italic; }

  /* ── MAIN CONTENT ── */
  #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── STATS BAR ── */
  #stats-bar {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 8px 20px; background: var(--surface2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #chart-title {
    font-family: var(--ff-title); font-size: 12px; letter-spacing: 2px;
    color: var(--text); margin-right: 8px; white-space: nowrap;
  }
  #chart-title span { font-size: 16px; margin-right: 6px; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat-label { font-family: var(--ff-title); font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .stat-value { font-family: var(--ff-title); font-size: 15px; color: var(--text); }
  .stat-value.up   { color: var(--bull); }
  .stat-value.down { color: var(--crimson-hi); }
  .sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

  /* ── CHART AREA ── */
  #chart-wrap {
    position: relative; padding: 12px 0 0 0;
    display: flex;
    height: 420px; min-height: 180px; max-height: calc(100vh - 120px);
    flex-shrink: 0;
  }
  #y-axis-canvas { width: 58px; flex-shrink: 0; }
  #chart-container { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; }

  /* drag handle */
  #resize-handle {
    height: 8px; cursor: ns-resize; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    user-select: none;
  }
  #resize-handle::before {
    content: ''; width: 40px; height: 2px;
    background: var(--muted); border-radius: 1px; opacity: .5;
  }
  #resize-handle:hover::before { background: var(--gold-dim); opacity: 1; }

  #tooltip {
    position: absolute; pointer-events: none;
    background: var(--surface2); border: 1px solid var(--border2);
    padding: 10px 14px; font-family: var(--ff-body); font-size: 13px;
    display: none; white-space: nowrap; z-index: 10;
  }
  #tooltip .t-title { font-family: var(--ff-title); font-size: 10px; letter-spacing: 2px; color: var(--gold); margin-bottom: 6px; }
  #tooltip .t-row { display: flex; justify-content: space-between; gap: 16px; color: var(--stone); margin: 2px 0; }
  #tooltip .t-row span { color: var(--text); }
  #crosshair-v, #crosshair-h {
    position: absolute; pointer-events: none; display: none;
    background: var(--muted); opacity: .3;
  }
  #crosshair-v { width: 1px; top: 0; bottom: 0; }
  #crosshair-h { height: 1px; left: 0; right: 0; }
  #empty-state {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-family: var(--ff-body); font-size: 16px; color: var(--muted); font-style: italic;
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">⚔ Arcane Market <span>/ charts</span></div>
  <input id="base-url-input" type="text" value="http://localhost:8080" />
</div>

<div id="layout">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">Reliques du marché</div>
    <div id="item-list">
      <div id="sidebar-empty">Chargement…</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-content">

    <div id="stats-bar">
      <div id="chart-title"><span id="ct-icon"></span><span id="ct-name">—</span></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Ouverture</div><div class="stat-value" id="s-open">—</div></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Clôture</div><div class="stat-value" id="s-close">—</div></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Haut</div><div class="stat-value up" id="s-high">—</div></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Bas</div><div class="stat-value down" id="s-low">—</div></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Variation</div><div class="stat-value" id="s-change">—</div></div>
      <div class="sep"></div>
      <div class="stat"><div class="stat-label">Bougies</div><div class="stat-value" id="s-count">—</div></div>
    </div>

    <div id="chart-wrap">
      <canvas id="y-axis-canvas"></canvas>
      <div id="chart-container">
        <canvas id="main-canvas"></canvas>
        <div id="crosshair-v"></div>
        <div id="crosshair-h"></div>
        <div id="tooltip">
          <div class="t-title" id="tt-idx">—</div>
          <div class="t-row">O <span id="tt-o">—</span></div>
          <div class="t-row">H <span id="tt-h">—</span></div>
          <div class="t-row">L <span id="tt-l">—</span></div>
          <div class="t-row">C <span id="tt-c">—</span></div>
        </div>
        <div id="empty-state">Sélectionne un item dans le menu.</div>
      </div>
    </div>
    <div id="resize-handle"></div>

  </div>
</div>

<script>
const BULL_BODY   = '#3a6648';
const BULL_STROKE = '#5a9468';
const BEAR_BODY   = '#4a1e24';
const BEAR_STROKE = '#8b2d3a';
const DOJI_STROKE = '#7a6035';
const GRID_COLOR  = 'rgba(42,37,48,.6)';
const TEXT_COLOR  = '#524850';

let candles = [];
let hoveredIdx = -1;

const mainCanvas = document.getElementById('main-canvas');
const yCanvas    = document.getElementById('y-axis-canvas');
const mc = mainCanvas.getContext('2d');
const yc = yCanvas.getContext('2d');

// ── Drag resize ───────────────────────────────────────────────────
const chartWrap    = document.getElementById('chart-wrap');
const resizeHandle = document.getElementById('resize-handle');
let dragging = false, dragStartY = 0, dragStartH = 0;

resizeHandle.addEventListener('mousedown', e => {
  dragging    = true;
  dragStartY  = e.clientY;
  dragStartH  = chartWrap.offsetHeight;
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const delta = e.clientY - dragStartY;
  const newH  = Math.max(180, Math.min(window.innerHeight - 130, dragStartH + delta));
  chartWrap.style.height = newH + 'px';
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ── Resize ────────────────────────────────────────────────────────
function resize() {
  const wrap = document.getElementById('chart-container');
  const dpr  = window.devicePixelRatio || 1;
  const W    = wrap.clientWidth;
  const H    = wrap.clientHeight;
  mainCanvas.width  = W * dpr;
  mainCanvas.height = H * dpr;
  mainCanvas.style.width  = W + 'px';
  mainCanvas.style.height = H + 'px';
  mc.setTransform(1, 0, 0, 1, 0, 0);
  mc.scale(dpr, dpr);
  yCanvas.width  = 58 * dpr;
  yCanvas.height = H  * dpr;
  yCanvas.style.width  = '58px';
  yCanvas.style.height = H + 'px';
  yc.setTransform(1, 0, 0, 1, 0, 0);
  yc.scale(dpr, dpr);
  draw();
}

const base = () => document.getElementById('base-url-input').value.replace(/\/$/, '');
let activeItemId = null;

async function loadItems() {
  const list = document.getElementById('item-list');
  try {
    const token = localStorage.getItem('token');
    const res   = await fetch(base() + '/api/market/blueprints',
      token ? { headers: { 'Authorization': 'Bearer ' + token } } : {});
    const items = await res.json();
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div id="sidebar-empty">Marché vide.</div>'; return;
    }
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'item-entry';
      el.dataset.id = item.marketId;
      el.innerHTML = `
        <div class="ie-icon">${item.icon || '🗡️'}</div>
        <div>
          <div class="ie-name">${item.title}</div>
          <div class="ie-rarity r-${item.rarity || 'COMMON'}">${item.rarity || ''}</div>
        </div>`;
      el.onclick = () => selectItem(item.blueprintId, item.title, item.icon);
      list.appendChild(el);
    });
    // auto-select first
    if (items.length) selectItem(items[0].blueprintId, items[0].title, items[0].icon);
  } catch(e) {
    list.innerHTML = '<div id="sidebar-empty">Erreur de chargement.</div>';
    console.warn(e);
  }
}

function selectItem(id, title, icon) {
  activeItemId = id;
  // highlight
  document.querySelectorAll('.item-entry').forEach(el => {
    el.classList.toggle('active', el.dataset.id == id);
  });
  document.getElementById('ct-icon').textContent = (icon || '🗡️') + ' ';
  document.getElementById('ct-name').textContent = title;
  loadChart(id);
}

async function loadChart(id) {
  if (!id) return;
  document.getElementById('empty-state').style.display = 'none';
  try {
    const token = localStorage.getItem('token');
    const res   = await fetch(base() + '/api/market/history/' + id,
      token ? { headers: { 'Authorization': 'Bearer ' + token } } : {});
    if (!res.ok) throw new Error(res.statusText);
    candles = await res.json();
    updateStats(candles);
    draw();
  } catch(e) {
    candles = [];
    document.getElementById('empty-state').style.display = 'flex';
    console.error(e);
  }
}

// ── Stats bar ─────────────────────────────────────────────────────
function updateStats(data) {
  if (!data.length) return;
  const first = data[0], last = data[data.length - 1];
  const high  = Math.max(...data.map(c => c.high));
  const low   = Math.min(...data.map(c => c.low));
  const pct   = ((last.close - first.open) / first.open * 100).toFixed(1);
  document.getElementById('s-open').textContent  = first.open  + ' ◆';
  document.getElementById('s-close').textContent = last.close  + ' ◆';
  document.getElementById('s-high').textContent  = high        + ' ◆';
  document.getElementById('s-low').textContent   = low         + ' ◆';
  document.getElementById('s-count').textContent = data.length;
  const ch = document.getElementById('s-change');
  ch.textContent = (pct >= 0 ? '+' : '') + pct + '%';
  ch.className = 'stat-value ' + (pct >= 0 ? 'up' : 'down');
}

// ── Draw ──────────────────────────────────────────────────────────
const TOTAL_SLOTS = 50;

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W   = mainCanvas.width;
  const H   = mainCanvas.height;
  mc.clearRect(0, 0, W, H);
  yc.clearRect(0, 0, yCanvas.width, yCanvas.height);

  if (!candles.length) return;

  const PAD_TOP = 24, PAD_BOT = 24, PAD_L = 8, PAD_R = 16;
  const chartH  = H - PAD_TOP - PAD_BOT;
  const chartW  = W - PAD_L - PAD_R;

  // ── Y scale — based on real candles only ──────────────────────
  const allHigh  = Math.max(...candles.map(c => c.high));
  const allLow   = Math.min(...candles.map(c => c.low));
  const rawRange = allHigh - allLow || 1;
  const yPad     = rawRange * .12;
  const yMin     = allLow  - yPad;
  const yMax     = allHigh + yPad;
  const yRange   = yMax - yMin;
  const toY      = v => PAD_TOP + (1 - (v - yMin) / yRange) * chartH;

  // ── Grid ──────────────────────────────────────────────────────
  const gridSteps = 6;
  yc.font      = '10px Courier New';
  yc.fillStyle = TEXT_COLOR;
  yc.textAlign = 'right';

  for (let i = 0; i <= gridSteps; i++) {
    const v = yMin + yRange * (i / gridSteps);
    const y = Math.round(toY(v)) + .5;
    mc.beginPath();
    mc.strokeStyle = i === 0 || i === gridSteps ? 'rgba(42,37,48,.9)' : GRID_COLOR;
    mc.lineWidth   = 1;
    mc.moveTo(PAD_L, y); mc.lineTo(W, y); mc.stroke();
    yc.fillText(Math.round(v) + '◆', 54, y + 4);
  }

  // ── Slots: always 50 ──────────────────────────────────────────
  const slotW  = chartW / TOTAL_SLOTS;
  const bodyW  = Math.max(2, Math.min(18, slotW * .62));
  const halfW  = bodyW / 2;
  const wickW  = Math.max(1, Math.round(bodyW * .15));

  // vertical slot separators (empty zone)
  mc.strokeStyle = 'rgba(42,37,48,.2)';
  mc.lineWidth   = .5;
  for (let i = candles.length; i < TOTAL_SLOTS; i++) {
    const x = Math.round(PAD_L + i * slotW) + .5;
    mc.beginPath(); mc.moveTo(x, PAD_TOP); mc.lineTo(x, H - PAD_BOT); mc.stroke();
  }

  // empty zone tint
  if (candles.length < TOTAL_SLOTS) {
    const emptyX = PAD_L + candles.length * slotW;
    mc.fillStyle = 'rgba(10,10,14,.4)';
    mc.fillRect(emptyX, PAD_TOP, chartW - candles.length * slotW, chartH);
  }

  candles.forEach((c, i) => {
    //const cx      = PAD_L + i * slotW + slotW / 2;
    const cx = PAD_L + (candles.length - 1 - i) * slotW + slotW / 2;
    const bull    = c.close >= c.open;
    const doji    = c.open  === c.close;
    const isHover = i === hoveredIdx;

    const yHigh  = Math.round(toY(c.high));
    const yLow   = Math.round(toY(c.low));
    const yOpen  = Math.round(toY(c.open));
    const yClose = Math.round(toY(c.close));
    const yTop   = Math.min(yOpen, yClose);
    const yBot   = Math.max(yOpen, yClose);
    const bH     = Math.max(1, yBot - yTop);

    const stroke = doji ? DOJI_STROKE : (bull ? BULL_STROKE : BEAR_STROKE);
    const fill   = isHover
      ? (doji ? '#9a7030' : (bull ? '#5aaa78' : '#aa3848'))
      : (doji ? '#3a3020' : (bull ? BULL_BODY  : BEAR_BODY));

    // upper wick
    if (yHigh < yTop) {
      mc.beginPath(); mc.strokeStyle = stroke; mc.lineWidth = wickW;
      mc.moveTo(Math.round(cx) + .5, yHigh);
      mc.lineTo(Math.round(cx) + .5, yTop); mc.stroke();
    }
    // lower wick
    if (yLow > yBot) {
      mc.beginPath(); mc.strokeStyle = stroke; mc.lineWidth = wickW;
      mc.moveTo(Math.round(cx) + .5, yBot);
      mc.lineTo(Math.round(cx) + .5, yLow); mc.stroke();
    }
    // body
    const bx = Math.round(cx - halfW);
    if (doji) {
      mc.beginPath(); mc.strokeStyle = DOJI_STROKE; mc.lineWidth = isHover ? 2 : 1.5;
      mc.moveTo(bx, yOpen); mc.lineTo(bx + bodyW, yOpen); mc.stroke();
    } else {
      mc.fillStyle = fill; mc.strokeStyle = stroke; mc.lineWidth = isHover ? 1.5 : 1;
      mc.beginPath(); mc.rect(bx, yTop, bodyW, bH); mc.fill(); mc.stroke();
    }
    if (isHover && !doji) {
      mc.strokeStyle = bull ? '#8addb0' : '#e05878'; mc.lineWidth = .5;
      mc.strokeRect(bx - 1, yTop - 1, bodyW + 2, bH + 2);
    }

    // x-axis label every 5 slots
    if (i % 5 === 0 || i === candles.length - 1) {
      mc.fillStyle = TEXT_COLOR; mc.font = '9px Courier New'; mc.textAlign = 'center';
      //mc.fillText(i + 1, Math.round(cx), H - 6);
      mc.fillText(candles.length - i, Math.round(cx), H - 6);
    }
  });

  // "slots remaining" label
  if (candles.length < TOTAL_SLOTS) {
    const remaining = TOTAL_SLOTS - candles.length;
    const labelX    = PAD_L + candles.length * slotW + (remaining * slotW) / 2;
    mc.fillStyle  = 'rgba(82,72,80,.35)';
    mc.font       = 'italic 11px Crimson Text, serif';
    mc.textAlign  = 'center';
    mc.fillText(`${remaining} bougies à venir`, labelX, H / 2);
  }
}

// ── Tooltip / crosshair ───────────────────────────────────────────
mainCanvas.addEventListener('mousemove', e => {
  if (!candles.length) return;
  const rect = mainCanvas.getBoundingClientRect();
  const mx   = e.clientX - rect.left;
  const my   = e.clientY - rect.top;
  const W    = mainCanvas.width;
  const PAD_L = 10;
  const candleGap = (W - PAD_L * 2) / TOTAL_SLOTS;
  const idx = Math.round((mx - PAD_L) / candleGap - .5);

  // crosshairs
  document.getElementById('crosshair-v').style.cssText = `display:block;left:${mx}px;top:0;bottom:0;width:1px`;
  document.getElementById('crosshair-h').style.cssText = `display:block;top:${my}px;left:0;right:0;height:1px`;

  if (idx < 0 || idx >= candles.length) {
    hideTooltip(); hoveredIdx = -1; draw(); return;
  }
  if (idx !== hoveredIdx) { hoveredIdx = idx; draw(); }

  const c = candles[idx];
  const bull = c.close >= c.open;
  const tt = document.getElementById('tooltip');
  document.getElementById('tt-idx').textContent = `Bougie ${idx + 1} / ${candles.length}`;
  document.getElementById('tt-o').textContent = c.open  + ' ◆';
  document.getElementById('tt-h').textContent = c.high  + ' ◆';
  document.getElementById('tt-l').textContent = c.low   + ' ◆';
  document.getElementById('tt-c').textContent = c.close + ' ◆';
  document.getElementById('tt-c').style.color = bull ? 'var(--bull)' : 'var(--crimson-hi)';

  let tx = mx + 14, ty = my - 80;
  if (tx + 140 > mainCanvas.clientWidth) tx = mx - 154;
  if (ty < 0) ty = my + 14;
  tt.style.cssText = `display:block;left:${tx}px;top:${ty}px`;
});

mainCanvas.addEventListener('mouseleave', () => {
  hideTooltip(); hoveredIdx = -1; draw();
  document.getElementById('crosshair-v').style.display = 'none';
  document.getElementById('crosshair-h').style.display = 'none';
});

function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const observer = new ResizeObserver(() => resize());
  observer.observe(document.getElementById('chart-container'));

  if (!localStorage.getItem('token')) {

  } else {
    loadItems();
  }
});
